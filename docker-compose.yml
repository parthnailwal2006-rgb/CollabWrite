version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL - support store only
  #
  # Holds users, document metadata, permissions and audit logs. It holds no
  # document content, no versions, no locks and no index; those belong to the
  # Academic Engine (rules.md section 8, architecture.md section 7).
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: collabwrite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-collabwrite}
      POSTGRES_USER: ${DB_USER:-collabuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collabpassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seeds/001_sample_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-collabuser} -d ${DB_NAME:-collabwrite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collabwrite_net

  # ===========================================================================
  # Backend - Express API, Socket.IO transport and the Academic Engine
  #
  # enginedata is a named volume rather than a bind mount because it holds
  # documents.dat, wal.log and index.dat. Losing it means losing every
  # document, and the crash-recovery demo depends on those files surviving a
  # container restart.
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_TARGET:-development}
    container_name: collabwrite_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-collabwrite}
      DB_USER: ${DB_USER:-collabuser}
      DB_PASSWORD: ${DB_PASSWORD:-collabpassword}
      JWT_SECRET: ${JWT_SECRET:-change_me_before_any_shared_deployment}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      ENGINE_DATA_DIR: /var/lib/collabwrite
      ENGINE_BUFFER_FRAMES: ${ENGINE_BUFFER_FRAMES:-8}
      ENGINE_WORKERS: ${ENGINE_WORKERS:-4}
      SCHEDULER_POLICY: ${SCHEDULER_POLICY:-FIFO}
      LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-5000}
      DEADLOCK_CHECK_INTERVAL_MS: ${DEADLOCK_CHECK_INTERVAL_MS:-250}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - enginedata:/var/lib/collabwrite
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - collabwrite_net

  # ===========================================================================
  # Frontend - React editor, served as static files by nginx
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: collabwrite_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - collabwrite_net

volumes:
  pgdata:
    driver: local
  enginedata:
    driver: local

networks:
  collabwrite_net:
    driver: bridge
