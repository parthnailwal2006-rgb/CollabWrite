# Serves the built React client and forwards API and WebSocket traffic to the
# backend container, so the browser sees a single origin and no CORS dance.

upstream collabwrite_backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page application: unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://collabwrite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://collabwrite_backend;
    }

    # Socket.IO needs the connection upgraded, and long-lived polling
    # fallbacks need a generous read timeout.
    location /socket.io/ {
        proxy_pass http://collabwrite_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
